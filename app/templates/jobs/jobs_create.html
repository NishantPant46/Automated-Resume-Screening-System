
{% extends "base.html" %}

{% block title %}
Create Job
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-header">
            <h4 class="mb-0">Create New Job</h4>
        </div>

        <div class="card-body">

            <form method="POST"
                  action="{{ url_for('job.create_job_page') }}">

                <!-- Job Title -->
                <div class="mb-3">

                    <label class="form-label">
                        Job Title
                    </label>

                    <input
                        type="text"
                        name="title"
                        placeholder="Job Title"
                        class="form-control"
                        required>

                </div>


                <!-- Company -->
                <div class="mb-3">

                    <label class="form-label">
                        Company
                    </label>

                    <input
                        type="text"
                        name="company"
                        placeholder="Company"
                        class="form-control"
                        required>

                </div>


                <!-- Job Description -->
                <div class="mb-3">

                    <label class="form-label">
                        Job Description
                    </label>

                    <textarea
                        name="description"
                        class="form-control"
                        placeholder="Enter detailed job description"
                        rows="5"
                        required></textarea>

                </div>


                <!-- Required Skills -->
                <div class="mb-3">

                    <label class="form-label">
                        Required Skills
                    </label>

                    <textarea
                        name="skills"
                        class="form-control"
                        placeholder="Example: Python, Flask, SQL, Git"
                        rows="3"
                        required></textarea>

                </div>


                <!-- Experience -->
                <div class="mb-3">

                    <label class="form-label">
                        Required Experience (Years)
                    </label>

                    <input
                        type="number"
                        name="experience"
                        class="form-control"
                        placeholder="Experience (Years)"
                        min="0"
                        required>

                </div>


                <!-- Deadline -->
                <div class="mb-3">

                    <label class="form-label">
                        Application Deadline
                    </label>

                    <input
                        type="date"
                        name="deadline"
                        class="form-control"
                        required>

                </div>


                <!-- Buttons -->
                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Save Job

                    </button>

                    <a
                        href="{{ url_for('job.jobs') }}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
