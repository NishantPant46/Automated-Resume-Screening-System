<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
    {% block title %}
    Automated Resume Screening System
    {% endblock %}
</title>

<!-- Bootstrap -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Custom CSS -->
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">


</head>

<body>


<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="{{ url_for('dashboard.dashboard') }}">
            Automated Resume Screening System
        </a>

        <div class="navbar-nav ms-auto d-flex flex-row gap-3">

            <a class="nav-link text-white"
               href="{{ url_for('dashboard.dashboard') }}">
                Dashboard
            </a>

            <a class="nav-link text-white"
               href="{{ url_for('resume.resume_page') }}">
                Upload Resume
            </a>

            <a class="nav-link text-white"
               href="{{ url_for('resume.candidates') }}">
                Candidates
            </a>

            <a class="nav-link text-white"
               href="{{ url_for('job.jobs') }}">
                Jobs
            </a>

            <a class="nav-link text-white"
               href="{{ url_for('report.reports') }}">
                Reports
            </a>

        </div>

    </div>

</nav>

<main class="page-content">

    {% block content %}

    {% endblock %}

</main>


</body>

</html>
